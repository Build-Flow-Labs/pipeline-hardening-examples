# The talk demo, as a button.
#
# Actions tab -> "demo" -> Run workflow. Each act is a scorecard: the five
# questions in plain English, with the raw terminal output collapsed
# underneath for anyone who wants the evidence.
#
# The numbers in the tables are pulled out of the real audit run rather than
# written here, and the qualitative findings are asserted before the table is
# printed. If the tool stops reporting one of them the step fails, so the
# page can never claim something the audit did not actually say.
name: demo
on:
  workflow_dispatch:

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Act 1 - the problem
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          ex="$REPO_URL/tree/main/examples"
          out=$(./tools/audit.sh demo/legacy-service)

          mut=$(printf '%s\n' "$out" | grep -oE '[0-9]+ mutable reference' | head -1 | grep -oE '[0-9]+')
          noperm=$(printf '%s\n' "$out" | grep -c 'no permissions: block anywhere')
          sec=$(printf '%s\n' "$out" | grep -oE '[0-9]+ secret reference' | head -1 | grep -oE '[0-9]+')

          # Fail rather than print a claim the audit did not make.
          printf '%s\n' "$out" | grep -q 'untrusted trigger AND checks out fork code'
          printf '%s\n' "$out" | grep -q 'gets every secret in the repository'
          printf '%s\n' "$out" | grep -q 'Self-hosted runners:'
          printf '%s\n' "$out" | grep -q 'actions/setup/action.yml'

          {
            echo "## Act 1 — an ordinary build"
            echo
            echo "|  | Question | \`demo/legacy-service\` |"
            echo "|:--:|---|---|"
            echo "| ❌ | [**Can anything change without a commit?**]($ex/01-pin-actions) | $mut movable tags. Two are in a composite action. |"
            echo "| ❌ | [**What could the build token do?**]($ex/02-least-privilege-tokens) | Unknown. $noperm workflows declare no permissions. |"
            echo "| ❌ | [**Who can influence the build?**]($ex/03-quarantine-untrusted-triggers) | Any fork. Its code runs with the repo's token. |"
            echo "| ❌ | [**Which secrets are exposed?**]($ex/04-scope-secrets-and-runners) | All of them. $sec in a shared env, plus \`secrets: inherit\`. |"
            echo "| ❌ | [**Would a moved tag be noticed?**]($ex/05-verify-what-you-consume) | No. |"
            echo
            echo "> [!WARNING]"
            echo "> Two of those tags are in \`.github/actions/setup/action.yml\`."
            echo "> \`ci.yml\` calls it by a local path, so a scan of \`.github/workflows\`"
            echo "> alone never opens the file."
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```console'
            echo '$ ./tools/audit.sh demo/legacy-service'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Act 2 - the same command on this repository
        run: |
          set -euo pipefail
          out=$(./tools/audit.sh .)

          printf '%s\n' "$out" | grep -q 'None found - every third-party step is SHA-pinned'
          printf '%s\n' "$out" | grep -q 'Every workflow declares its permissions'
          printf '%s\n' "$out" | grep -q 'No untrusted-context triggers'
          printf '%s\n' "$out" | grep -q 'No broadly scoped secret definitions found'
          printf '%s\n' "$out" | grep -q 'Pinned references cannot change without a commit'

          {
            echo "## Act 2 — the same command, on this repository"
            echo
            echo "|  | Question | this repository |"
            echo "|:--:|---|---|"
            echo "| ✅ | **Can anything change without a commit?** | Every step is pinned to a commit. |"
            echo "| ✅ | **What could the build token do?** | Read-only. Each job says so in the file. |"
            echo "| ✅ | **Who can influence the build?** | No untrusted triggers. |"
            echo "| ✅ | **Which secrets are exposed?** | None above step level. |"
            echo "| ✅ | **Would a moved tag be noticed?** | Moving a tag changes nothing here. |"
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```console'
            echo '$ ./tools/audit.sh .'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Act 3 - how you get from one to the other
        run: |
          set -euo pipefail
          cp demo/legacy-service/.github/workflows/ci.yml /tmp/ci.yml
          ./tools/pin.sh --write /tmp/ci.yml 2>/dev/null

          # pin.sh keeps the original as .bak, so the two files are a
          # before-and-after of the same steps, line for line.
          mapfile -t before < <(grep -oE 'uses: [^ ]+' /tmp/ci.yml.bak | sed 's/^uses: //')
          mapfile -t after  < <(grep -oE 'uses: [^ ]+' /tmp/ci.yml   | sed 's/^uses: //')

          # One row per distinct reference - the same action used by two steps is
          # one fact, not two - and the successes grouped ahead of the two it
          # could not pin, so the table reads as "what it did, then what it
          # honestly could not".
          declare -A seen=()
          pinned_rows="" skipped_rows=""
          for i in "${!before[@]}"; do
            b="${before[$i]}"; a="${after[$i]}"
            [ -n "${seen[$b]:-}" ] && continue
            seen[$b]=1
            if [ "$a" != "$b" ]; then
              sha="${a#*@}"
              pinned_rows+="| ✅ | \`$b\` | pinned to \`${sha:0:12}…\` |"$'\n'
            elif [ "${b#./}" != "$b" ]; then
              skipped_rows+="| ➖ | \`$b\` | Local path. Nothing to pin here, and its own tags are still movable. |"$'\n'
            else
              skipped_rows+="| ⚠️ | \`$b\` | No such repo. Skipped. |"$'\n'
            fi
          done
          rows="$pinned_rows$skipped_rows"

          {
            echo "## Act 3 — pinning it"
            echo
            echo "Running \`./tools/pin.sh --write\` on that project's \`ci.yml\`:"
            echo
            echo "|  | Reference | Result |"
            echo "|:--:|---|---|"
            printf '%s' "$rows"
            echo
            echo "> [!NOTE]"
            echo "> Uses \`git ls-remote\`, so it needs no token and hits no rate limit."
            echo "> Anything it cannot resolve is left alone and listed."
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```console'
            echo '$ ./tools/pin.sh --write ci.yml'
            echo '$ grep uses: ci.yml'
            grep 'uses:' /tmp/ci.yml
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Where to get it
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "---"
            echo
            echo "## $REPO_URL"
          } >> "$GITHUB_STEP_SUMMARY"
