        env:
          TOOL_VERSION: "1.7.7"
          TOOL_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          curl -fsSL -o tool.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${TOOL_VERSION}/actionlint_${TOOL_VERSION}_linux_amd64.tar.gz"
          echo "${TOOL_SHA256}  tool.tar.gz" | sha256sum -c -
